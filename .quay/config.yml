# .quay/config.yml — generated by quay-init (SPEC §6 closed set).
# The provider mcp_entry points at the quay PLUGIN's vendored native runtime (delivered by the plugin,
# not laid down into this project). The loop section carries the target-project values the driver reads.
providers:
  native:
    enabled: true
    tasks_dir: "/data/home/yale/work/claudecodeui/tasks"
    env:
      QUAY_NATIVE_TASKS_DIR: "/data/home/yale/work/claudecodeui/tasks"
      QUAY_NATIVE_GOAL_DIR: "/data/home/yale/work/claudecodeui/goals"
      QUAY_NATIVE_ADR_DIR: "/data/home/yale/work/claudecodeui/adr"
      QUAY_NATIVE_META_DIR: "/data/home/yale/work/claudecodeui/meta"
loop:
  repo_root: /data/home/yale/work/claudecodeui
  # quay's mechanical fan-in runs this project's test entrypoint with its own value-taking flags
  # (--buckets / --root / --state-dir / --runner / --log-file / --run-id, plus --test-concurrency=N).
  # If you ship scripts/test.sh, it MUST consume such a flag together with its VALUE (shift 2) and
  # MUST NOT read a flag's value as a positional test-file argument — otherwise every fan-in round
  # reds with "Could not find '<value>'" and burns a whole worker session.
  # Full contract + a drop-in case block: plugin/skills/init/SKILL.md, section "loop.test_command
  # contract".
  test_command: bash scripts/test.sh
  # Declared explicitly: plugin >= 0.14.0 runs a bare `test_command` when this key is absent ("delegated"),
  # without --test-concurrency, so scripts/test.sh falls back to its built-in CONCURRENCY=4. quay-buckets goes
  # through full-suite-runner.ts, which splices a host-derived --test-concurrency (test.sh clamps it to 16).
  # Measured 2026-10-05, server phase only, same 229 files: 401.0s at 4 vs 202.7s at 16.
  suite_runner: quay-buckets
  # Failed-file rerun channel (gap-loop-rerun-command-undeclared-so-every-flake-parks-needs-human).
  # When a fan-in suite reds, worker-driver reruns ONLY the files the suite named, in the same
  # round and lock; a fully green rerun is `rerun-green` (a load flake — land as green), a still-red
  # rerun is `rerun-red` (a real red). Contract (worker-driver.ts resolveRerunCommand /
  # applyFileTemplate): a NON-empty argv array; `{files}` is spliced element-by-element (one named
  # file per argv entry), `{worktree}` is substituted into any element; RERUN_TIMEOUT_MS = 300000.
  # Undeclared => `no-rerun-command-declared` (driver stops, cannot attribute the flake); wrong type
  # => `declaration-unreadable` (not silent). The script dispatches e2e specs to the playwright lane
  # and everything else to scripts/test.sh — ⛔ it is NOT `bash scripts/test.sh {files}`: an e2e spec
  # fed there is never executed (vitest include is src/** only ⇒ 0 tests; test.sh then exits 0 on an
  # empty per-file set), so a browser flake and a real e2e red would BOTH read as green.
  rerun_command:
    - bash
    - "{worktree}/scripts/quay-rerun-failed.sh"
    - --worktree
    - "{worktree}"
    - "{files}"
  tmux_session: null
  worktree_root: /data/home/yale/work/claudecodeui/../claudecodeui-worktrees
  # ⚠️ 本 heredoc 是【新装】写者，而版本级默认值的正本是 packages/quay/src/init.ts 的
  # ⛔ 本 heredoc 的定界符 EOF 【未加引号】⇒ 正文（注释也算）里的反引号、以及「美元符号 + 圆括号」
  # 的替换形式都会被【求值】——写成注释也照样执行，且产物是【写出的 .quay/config.yml】。
  # 实证 2026-09-18（gap-touches-parser-early-subheading-latch-hides-declaration 的 fan-in 全量红）：
  # 下一行原先把 CLI 后面的命令用反引号包住 ⇒ 写出的 config 里那条注释被换成该命令的真实输出
  # （多行），第二行没有井号 ⇒ 整个文件变成非法 YAML（yaml.scanner.ScannerError:
  # could not find expected ':'）⇒ 此后每次 quay-init 升级都 exit 1，三个真装机 e2e 全红。
  # LOOP_VERSION_DEFAULTS（CLI 的 quay init --reconcile 子命令用它做 diff）。shell 无法 import TS，
  # 所以这一行是【镜像】：新增版本级默认值时要同时改两处，或把这里改成从 schema 派生。
  # 该不变式由 plugin/test/quay-init-loop.test.mjs 的 "AC5" 用例机械钉住（扫描本文件全部未加引号的
  # heredoc 正文，反引号/命令替换一处即红）——⛔ 不要靠"记得转义"，那正是它复发的方式。
  # ⛔ 不要在这里补那个已被删除的零消费者分支键：plugin/test/quay-init.test.mjs 以可执行的判据
  # 钉住"它不被写出"（gap-config-key-consumer-check-mechanical-enumeration）；理由见 init.ts。
  fork_baseline: develop
  board: native
  gates:
    - acceptance
  doc_surfaces:
    - tasks/
    - goals/
    - .quay/

  # ── OPEN-SEMANTIC-DISCOVERY trial (coordinator, 2026-10-13) ──────────────────────────────────────
  # Report-only, enabled for the first time on this host (quay's own repo has run it since 2026-10-12;
  # this project had NO discovery section at all before this change — confirmed by a read-only audit).
  # ⛔ Deliberately conservative vs quay's own config (120 calls/$30 per 24h): this is a fresh
  # deployment on a different host with its own live workload, so the ceiling starts low and can be
  # raised later from measured usage, not guessed up front (same discipline as quay's own 24/240 history).
  # interval_until makes this a stated TRIAL window, not a silent permanent cadence change; it falls
  # back to being inert (still gated by enabled/budget) rather than escalating if nobody revisits it.
  # Kill switch: enabled:false (or deleting this block) ⇒ zero spawns, same as quay's own routine.
  open_semantic_discovery:
    enabled: true
    interval: interval:60m
    interval_until: 2026-10-20T09:00:00Z
    investigator_runs: 1
    max_clusters_verified: 2
    verifier_max_turns: 8
    refutation_max_turns: 6
    max_wall_ms: 1200000
    max_model_calls_per_24h: 24
    max_usd_per_24h: 5

  # ── ARCH_DISCOVERY (human-authorized 2026-10-14; committed so a driver sync cannot drop it) ─────────
  # Mechanical only (space/time instruments): NO model calls, NO USD — no budget key, no interaction
  # with OSD's caps above. Report-only: appends to .quay/arch-discovery-findings.jsonl, never files a task.
  # Note: on this (non-quay) tree the space instrument has no candidate universe — tracked upstream as
  # gap-arch-discovery-space-instrument-has-no-candidate-universe-on-non-quay-hosts.
  # Kill switch: enabled:false (or delete this block) ⇒ zero spawns.
  arch_discovery:
    enabled: true
    interval: interval:360m
    since_days: 7
    max_ms: 60000
    max_records: 1000
    max_old_space_mb: 512

  # ── DISCOVERY_METHOD (human-authorized 2026-10-14; committed so a driver sync cannot drop it) ──────
  # Report-only (watermarked ingest → bounded reflect → held-out verify); never files a task.
  # Its 24h model-call ceiling lives on its OWN ledger (.quay/discovery-method-model-budget.jsonl),
  # independent of OSD's max_model_calls_per_24h / max_usd_per_24h above — enabling it does not raise
  # or share OSD's budget. Conservative vs quay's own 240/24h.
  # Kill switch: enabled:false ⇒ zero spawns.
  discovery_method:
    enabled: true
    interval: interval:360m
    max_model_calls_per_24h: 16
    max_experiences: 4
    max_model_calls: 4
    verify_reserve: 2
    reflection_tools: Read,Grep,Glob
    reflection_max_turns: 8
    max_wall_ms: 900000

# Active GOAL cap (goal-store readGoalConfig; default 3). Raised to 5 by human yale 2026-10-12.
goals:
  cap: 5
